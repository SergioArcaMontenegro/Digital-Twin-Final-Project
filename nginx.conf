server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json model/gltf-binary image/svg+xml;
    gzip_min_length 1024;

    # Recursos con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Modelos 3D de los robots (.glb): tipo MIME correcto y caché
    location /models/ {
        location ~ \.glb$ { default_type model/gltf-binary; expires 7d; add_header Cache-Control "public"; }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
